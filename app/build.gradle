plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.mcqgrader'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.mcqgrader"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // OpenCV - Maven version for GitHub Actions compatibility
    implementation 'com.quickbirdstudios:opencv-android:4.5.3.0'

    // ML Kit for Text Recognition (OCR)
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.0'

    // CameraX for capturing the OMR sheet
    def camerax_version = "1.3.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
}
